<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-label="forge — the SDLC skill set that learns as you work">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD08A"/>
      <stop offset="0.55" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#F2701C"/>
    </linearGradient>
    <radialGradient id="heat" cx="0.12" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#FF7A1A" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- terminal window -->
  <rect x="0" y="0" width="1100" height="440" rx="16" fill="#0E0D0C"/>
  <rect x="0" y="0" width="1100" height="440" rx="16" fill="url(#heat)"/>
  <rect x="0.75" y="0.75" width="1098.5" height="438.5" rx="15.25" fill="none" stroke="#2A2620" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="34" cy="26" r="7" fill="#FF5F56"/>
  <circle cx="60" cy="26" r="7" fill="#FFBD2E"/>
  <circle cx="86" cy="26" r="7" fill="#27C93F"/>
  <text x="550" y="31" text-anchor="middle" font-family="'Cascadia Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="17" fill="#6E655A">forge · ~/.claude/skills/forge</text>
  <line x1="0" y1="52" x2="1100" y2="52" stroke="#221E18" stroke-width="1.5"/>

  <!-- ASCII art (ANSI Shadow), molten amber -->
  <g font-family="'Cascadia Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="36" fill="url(#ember)" xml:space="preserve">
    <text x="70" y="128">███████╗ ██████╗ ██████╗  ██████╗ ███████╗</text>
    <text x="70" y="168">██╔════╝██╔═══██╗██╔══██╗██╔════╝ ██╔════╝</text>
    <text x="70" y="208">█████╗  ██║   ██║██████╔╝██║  ███╗█████╗  </text>
    <text x="70" y="248">██╔══╝  ██║   ██║██╔══██╗██║   ██║██╔══╝  </text>
    <text x="70" y="288">██║     ╚██████╔╝██║  ██║╚██████╔╝███████╗</text>
    <text x="70" y="328">╚═╝      ╚═════╝ ╚═╝  ╚═╝ ╚═════╝ ╚══════╝</text>
  </g>

  <!-- prompt + output -->
  <text x="70" y="378" font-family="'Cascadia Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="22" xml:space="preserve"><tspan fill="#27C93F">$</tspan><tspan fill="#C9C1B5"> forge build</tspan></text>
  <text x="70" y="408" font-family="'Cascadia Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="22" xml:space="preserve"><tspan fill="#FF9A3D">✦ </tspan><tspan fill="#9C907E">14 skills loaded · the SDLC skill set that learns as you work </tspan><tspan fill="#FF9A3D">▮</tspan></text>
