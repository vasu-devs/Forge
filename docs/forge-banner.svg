<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-label="forge — the SDLC skill set that learns as you work">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCF8F1"/>
      <stop offset="1" stop-color="#C6BEB1"/>
    </linearGradient>
    <radialGradient id="heat" cx="0.16" cy="0.52" r="0.62">
      <stop offset="0" stop-color="#FF7A1A" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FFE2B0"/>
      <stop offset="0.45" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#E8551F"/>
    </radialGradient>
  </defs>

  <!-- iron background + forge heat glow + subtle frame -->
  <rect x="0" y="0" width="1100" height="340" rx="26" fill="#15120E"/>
  <rect x="0" y="0" width="1100" height="340" rx="26" fill="url(#heat)"/>
  <rect x="1" y="1" width="1098" height="338" rx="25" fill="none" stroke="#2D2820" stroke-width="1.5"/>

  <!-- spark mark -->
  <g stroke="#FF9A3D" stroke-width="6" stroke-linecap="round">
    <line x1="150" y1="170" x2="150" y2="114"/>
    <line x1="150" y1="170" x2="198" y2="138"/>
    <line x1="150" y1="170" x2="212" y2="172"/>
    <line x1="150" y1="170" x2="190" y2="214"/>
    <line x1="150" y1="170" x2="150" y2="228"/>
    <line x1="150" y1="170" x2="106" y2="140"/>
    <line x1="150" y1="170" x2="112" y2="208"/>
  </g>
  <circle cx="150" cy="170" r="15" fill="url(#ember)"/>

  <!-- wordmark -->
  <text x="232" y="208" font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif" font-weight="800" font-size="150" letter-spacing="-7" fill="url(#steel)">forge</text>

  <!-- molten underline with a glowing strike-point -->
  <rect x="236" y="232" width="392" height="7" rx="3.5" fill="#EE7A2E"/>
  <circle cx="636" cy="235.5" r="8.5" fill="url(#ember)"/>

  <!-- tagline (mono, no em-dash) -->
  <text x="238" y="286" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="26" letter-spacing="0.5" fill="#A99B88">// the SDLC skill set that learns as you work</text>

  <!-- drifting embers to balance the right -->
  <g fill="url(#ember)">
    <circle cx="948" cy="150" r="6"/>
    <circle cx="992" cy="120" r="4"/>
    <circle cx="912" cy="116" r="3.5"/>
    <circle cx="972" cy="188" r="3"/>
  </g>
  <g stroke="#FF9A3D" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="948" y1="150" x2="948" y2="132"/>
    <line x1="992" y1="120" x2="992" y2="107"/>
  </g>
</svg>
